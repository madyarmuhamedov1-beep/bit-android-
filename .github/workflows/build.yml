name: Build Bit APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Unzip project
      run: |
        sudo apt-get install -y unzip
        unzip bit-modern-android.zip
        ls -la bit-modern-android/
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: "8.7"
    
    - name: Build APK
      working-directory: ./bit-modern-android
      run: gradle assembleRelease
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: bit-apk
        path: bit-modern-android/app/build/outputs/apk/release/*.apk
        
